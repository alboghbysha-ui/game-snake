<script src="https://ad.gigapub.tech/script?id=6957"></script>

<script>

let coins = Number(localStorage.getItem("coins") || 0);

window.addEventListener("load", () => {
    console.log("SDK loaded:", typeof window.showGiga);
});

function watchAd(){

    let msg = document.getElementById("msg");

    if(typeof window.showGiga !== "function"){
        msg.innerText = "❌ SDK هنوز فعال نشده (دامنه یا پنل مشکل دارد)";
        return;
    }

    msg.innerText = "⏳ در حال لود تبلیغ...";

    window.showGiga()
    .then(() => {

        coins += 100;
        localStorage.setItem("coins", coins);

        document.getElementById("balance").innerText =
            coins + " سکه";

        msg.innerText = "✅ پاداش دریافت شد";

    })
    .catch(() => {
        msg.innerText = "❌ تبلیغ نمایش داده نشد";
    });

}

</script>
