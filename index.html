<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>سکه باز - ۱۰۰ تبلیغ روزانه</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            color: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .game-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* هدر طلایی */
        .top-bar {
            background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .balance-box {
            background: rgba(255,215,0,0.1);
            border-radius: 15px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-icon {
            font-size: 28px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .balance-amount {
            font-size: 28px;
            font-weight: 900;
            color: #ffd700;
        }

        .ad-counter-box {
            background: linear-gradient(135deg, #ff4757, #ff6348);
            border-radius: 15px;
            padding: 10px 20px;
            text-align: center;
            min-width: 100px;
        }

        .ad-counter-label {
            font-size: 10px;
            opacity: 0.9;
        }

        .ad-counter-number {
            font-size: 24px;
            font-weight: 900;
        }

        .ad-counter-total {
            font-size: 14px;
            opacity: 0.8;
        }

        /* نوار پیشرفت تبلیغات */
        .ad-progress-container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .ad-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6348);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .ad-progress-text {
            font-size: 10px;
            text-align: center;
            margin-top: 3px;
            opacity: 0.7;
        }

        /* سکه اصلی */
        .coin-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
        }

        .coin-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px dashed rgba(255,215,0,0.2);
            animation: spin 10s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-coin {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 35% 35%, #ffe566, #ffd700 40%, #b8960f);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            box-shadow: 
                0 15px 40px rgba(255,215,0,0.4),
                0 0 80px rgba(255,215,0,0.1),
                inset 0 -8px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            position: relative;
            z-index: 2;
        }

        .main-coin:active {
            transform: scale(0.85);
        }

        .main-coin.tapped {
            animation: coinTap 0.3s ease;
        }

        @keyframes coinTap {
            0% { transform: scale(1); }
            30% { transform: scale(0.8); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .float-text {
            position: absolute;
            pointer-events: none;
            font-weight: 900;
            color: #ffd700;
            font-size: 20px;
            animation: floatAway 0.7s ease-out forwards;
            z-index: 10;
        }

        @keyframes floatAway {
            0% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
            100% { 
                opacity: 0; 
                transform: translateY(-100px) scale(1.8); 
            }
        }

        .click-hint {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.5;
            animation: fadeInOut 2s infinite;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }

        /* دکمه‌های تبلیغ */
        .ad-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .ad-btn {
            padding: 18px 12px;
            border-radius: 18px;
            border: none;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .ad-btn:active {
            transform: scale(0.94);
        }

        .ad-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(50%);
        }

        .ad-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .btn-double {
            background: linear-gradient(135deg, #ff6b6b, #c0392b);
            box-shadow: 0 8px 25px rgba(255,107,107,0.3);
        }

        .btn-auto {
            background: linear-gradient(135deg, #a29bfe, #4834d4);
            box-shadow: 0 8px 25px rgba(162,155,254,0.3);
        }

        .btn-lucky {
            background: linear-gradient(135deg, #fdcb6e, #e67e22);
            box-shadow: 0 8px 25px rgba(253,203,110,0.3);
            grid-column: 1 / -1;
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #55efc4, #006266);
            box-shadow: 0 8px 25px rgba(85,239,196,0.3);
            grid-column: 1 / -1;
            margin-top: 5px;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4757;
            color: white;
            border-radius: 10px;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: 900;
            z-index: 5;
        }

        .cooldown-text {
            font-size: 10px;
            opacity: 0.8;
            display: block;
            margin-top: 3px;
        }

        /* استاتوس بار */
        .status-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            padding: 12px;
            margin-top: 5px;
        }

        .status-item {
            text-align: center;
            flex: 1;
        }

        .status-value {
            font-weight: 900;
            font-size: 16px;
            color: #ffd700;
        }

        .status-label {
            font-size: 9px;
            opacity: 0.6;
            margin-top: 3px;
        }

        .status-divider {
            width: 1px;
            background: rgba(255,255,255,0.1);
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a3e;
            border: 1px solid rgba(255,215,0,0.3);
            padding: 12px 25px;
            border-radius: 15px;
            z-index: 1000;
            font-weight: 700;
            font-size: 14px;
            animation: slideDown 0.4s ease;
            text-align: center;
            max-width: 90%;
        }

        @keyframes slideDown {
            from { transform: translateX(-50%) translateY(-120%); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        /* مودال */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #1a1a3e;
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-box h3 {
            margin-bottom: 15px;
            font-size: 20px;
        }

        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            margin: 8px 0;
            text-align: center;
            font-size: 14px;
        }

        .modal-box .btn-action {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #00b894;
            color: #fff;
            font-family: 'Vazirmatn', sans-serif;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            float: left;
            margin-bottom: 10px;
        }

        .limit-reached {
            text-align: center;
            padding: 20px;
            background: rgba(255,71,87,0.1);
            border-radius: 15px;
            border: 1px dashed #ff4757;
            margin: 15px 0;
        }

        .limit-reached-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .limit-reached-text {
            font-weight: 700;
            color: #ff4757;
            margin-bottom: 5px;
        }

        .limit-reached-sub {
            font-size: 11px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- بالاترین بخش -->
        <div class="top-bar">
            <div class="balance-row">
                <div class="balance-box">
                    <span class="balance-icon">🪙</span>
                    <span class="balance-amount" id="balanceDisplay">0</span>
                </div>
                <div class="ad-counter-box">
                    <div class="ad-counter-label">📺 تبلیغات امروز</div>
                    <div class="ad-counter-number">
                        <span id="adsWatched">0</span>
                        <span class="ad-counter-total">/100</span>
                    </div>
                </div>
            </div>
            <div class="ad-progress-container">
                <div class="ad-progress-fill" id="adProgressBar" style="width: 0%"></div>
            </div>
            <div class="ad-progress-text" id="adProgressText">۰ از ۱۰۰ تبلیغ دیده شده</div>
        </div>

        <!-- سکه مرکزی -->
        <div class="coin-section">
            <div class="coin-ring"></div>
            <div class="main-coin" id="mainCoin" onclick="tapCoin(event)">
                🪙
            </div>
            <div class="click-hint">👆 روی سکه کلیک کن</div>
        </div>

        <!-- محدودیت رسیده -->
        <div class="limit-reached" id="limitReachedBox" style="display:none;">
            <div class="limit-reached-icon">🎉</div>
            <div class="limit-reached-text">آفرین! سقف ۱۰۰ تبلیغ امروز پر شد</div>
            <div class="limit-reached-sub">فردا دوباره می‌تونی تبلیغ ببینی</div>
        </div>

        <!-- دکمه‌های تبلیغ -->
        <div class="ad-buttons" id="adButtonsContainer">
            <button class="ad-btn btn-double" id="btnDouble" onclick="watchAd('double')">
                🔥 دوبرابر کلیک
                <span class="cooldown-text">۳۰ ثانیه - نیاز به تبلیغ</span>
            </button>
            <button class="ad-btn btn-auto" id="btnAuto" onclick="watchAd('auto')">
                🤖 کلیک خودکار
                <span class="cooldown-text">۳۰ ثانیه - نیاز به تبلیغ</span>
            </button>
            <button class="ad-btn btn-lucky" id="btnLucky" onclick="watchAd('lucky')">
                🎁 جعبه شانس
                <span class="cooldown-text">سکه تصادفی - نیاز به تبلیغ</span>
            </button>
            <button class="ad-btn btn-withdraw" onclick="openWithdrawModal()">
                💰 برداشت موجودی
            </button>
        </div>

        <!-- استاتوس -->
        <div class="status-bar">
            <div class="status-item">
                <div class="status-value" id="totalClicks">0</div>
                <div class="status-label">کلیک امروز</div>
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <div class="status-value" id="multiplierDisplay">1x</div>
                <div class="status-label">ضریب فعلی</div>
            </div>
            <div class="status-divider"></div>
            <div class="status-item">
                <div class="status-value" id="earningRate">1</div>
                <div class="status-label">سکه/کلیک</div>
            </div>
        </div>

    </div>

    <!-- مودال برداشت -->
    <div class="modal-overlay" id="withdrawModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeWithdrawModal()">✕</button>
            <h3>💰 برداشت سکه</h3>
            <p style="opacity:0.7; margin-bottom:10px;">حداقل برداشت: <strong>۱۰۰۰ سکه</strong></p>
            <p>موجودی: <strong id="modalBalance">0</strong> سکه</p>
            <input type="text" placeholder="آدرس کیف پول (اختیاری)" id="walletInput">
            <input type="number" placeholder="مقدار سکه" id="amountInput" min="1000">
            <button class="btn-action" onclick="submitWithdraw()">📤 ثبت درخواست</button>
            <p style="font-size:9px; opacity:0.5; margin-top:10px;">پردازش ۲۴ الی ۴۸ ساعت</p>
        </div>
    </div>

    <!-- نوتیفیکیشن -->
    <div class="notification" id="notification" style="display:none;"></div>

    <script>
        // ==================== STATE ====================
        const DAILY_AD_LIMIT = 100;
        
        let gameState = {
            balance: parseInt(localStorage.getItem('sakeBaz_balance') || '0'),
            totalClicks: parseInt(localStorage.getItem('sakeBaz_clicks') || '0'),
            adsWatchedToday: parseInt(localStorage.getItem('sakeBaz_ads') || '0'),
            multiplier: 1,
            doubleActive: false,
            autoActive: false,
            autoInterval: null,
            lastDate: localStorage.getItem('sakeBaz_date'),
            cooldowns: {
                double: null,
                auto: null,
                lucky: null
            }
        };

        // ==================== DAILY RESET ====================
        const todayStr = new Date().toDateString();
        if (gameState.lastDate !== todayStr) {
            gameState.adsWatchedToday = 0;
            gameState.totalClicks = 0;
            gameState.lastDate = todayStr;
            localStorage.setItem('sakeBaz_date', todayStr);
            saveState();
        }

        // ==================== HELPERS ====================
        function saveState() {
            localStorage.setItem('sakeBaz_balance', gameState.balance);
            localStorage.setItem('sakeBaz_clicks', gameState.totalClicks);
            localStorage.setItem('sakeBaz_ads', gameState.adsWatchedToday);
            updateAllUI();
        }

        function updateAllUI() {
            document.getElementById('balanceDisplay').textContent = numberFormat(gameState.balance);
            document.getElementById('adsWatched').textContent = gameState.adsWatchedToday;
            document.getElementById('totalClicks').textContent = numberFormat(gameState.totalClicks);
            document.getElementById('multiplierDisplay').textContent = gameState.multiplier + 'x';
            document.getElementById('earningRate').textContent = (1 * gameState.multiplier);
            
            // Progress bar
            const pct = Math.min((gameState.adsWatchedToday / DAILY_AD_LIMIT) * 100, 100);
            document.getElementById('adProgressBar').style.width = pct + '%';
            document.getElementById('adProgressText').textContent = 
                gameState.adsWatchedToday + ' از ' + DAILY_AD_LIMIT + ' تبلیغ دیده شده';
            
            // Limit reached
            const limitBox = document.getElementById('limitReachedBox');
            const buttonsContainer = document.getElementById('adButtonsContainer');
            
            if (gameState.adsWatchedToday >= DAILY_AD_LIMIT) {
                limitBox.style.display = 'block';
                buttonsContainer.style.opacity = '0.4';
                buttonsContainer.style.pointerEvents = 'none';
            } else {
                limitBox.style.display = 'none';
                buttonsContainer.style.opacity = '1';
                buttonsContainer.style.pointerEvents = 'auto';
            }
            
            // Buttons states
            updateButtonStates();
        }

        function updateButtonStates() {
            const btnDouble = document.getElementById('btnDouble');
            const btnAuto = document.getElementById('btnAuto');
            const btnLucky = document.getElementById('btnLucky');
            
            // Double button
            if (gameState.doubleActive) {
                btnDouble.disabled = true;
                btnDouble.querySelector('.cooldown-text').textContent = '⚡ فعال است';
            } else if (gameState.adsWatchedToday >= DAILY_AD_LIMIT) {
                btnDouble.disabled = true;
                btnDouble.querySelector('.cooldown-text').textContent = '⛔ سقف تبلیغ پر شد';
            } else {
                btnDouble.disabled = false;
                btnDouble.querySelector('.cooldown-text').textContent = '۳۰ ثانیه - نیاز به تبلیغ';
            }
            
            // Auto button
            if (gameState.autoActive) {
                btnAuto.disabled = true;
                btnAuto.querySelector('.cooldown-text').textContent = '⚡ فعال است';
            } else if (gameState.adsWatchedToday >= DAILY_AD_LIMIT) {
                btnAuto.disabled = true;
                btnAuto.querySelector('.cooldown-text').textContent = '⛔ سقف تبلیغ پر شد';
            } else {
                btnAuto.disabled = false;
                btnAuto.querySelector('.cooldown-text').textContent = '۳۰ ثانیه - نیاز به تبلیغ';
            }
            
            // Lucky button
            if (gameState.adsWatchedToday >= DAILY_AD_LIMIT) {
                btnLucky.disabled = true;
                btnLucky.querySelector('.cooldown-text').textContent = '⛔ سقف تبلیغ پر شد';
            } else {
                btnLucky.disabled = false;
                btnLucky.querySelector('.cooldown-text').textContent = 'سکه تصادفی - نیاز به تبلیغ';
            }
        }

        function numberFormat(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function showNotification(msg, duration = 2000) {
            const notif = document.getElementById('notification');
            notif.textContent = msg;
            notif.style.display = 'block';
            clearTimeout(notif._timeout);
            notif._timeout = setTimeout(() => {
                notif.style.display = 'none';
            }, duration);
        }

        // ==================== COIN TAP ====================
        function tapCoin(event) {
            const coin = document.getElementById('mainCoin');
            
            // Animation
            coin.classList.add('tapped');
            setTimeout(() => coin.classList.remove('tapped'), 300);
            
            // Earn coins
            const earned = 1 * gameState.multiplier;
            gameState.balance += earned;
            gameState.totalClicks++;
            
            // Floating text
            const floatEl = document.createElement('div');
            floatEl.className = 'float-text';
            floatEl.textContent = '+' + earned;
            
            // Position
            const coinRect = coin.getBoundingClientRect();
            const cx = coinRect.left + coinRect.width / 2;
            const cy = coinRect.top + coinRect.height / 2;
            floatEl.style.left = cx + 'px';
            floatEl.style.top = cy + 'px';
            
            document.body.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 700);
            
            saveState();
        }

        // ==================== AD HANDLER ====================
        function watchAd(type) {
            // Check limit
            if (gameState.adsWatchedToday >= DAILY_AD_LIMIT) {
                showNotification('⛔ سقف ۱۰۰ تبلیغ امروز پر شده! فردا بیا', 3000);
                return;
            }
            
            // Check if already active
            if (type === 'double' && gameState.doubleActive) {
                showNotification('⚡ دوبرابر الان فعاله!', 1500);
                return;
            }
            if (type === 'auto' && gameState.autoActive) {
                showNotification('🤖 کلیک خودکار الان فعاله!', 1500);
                return;
            }
            
            // Show ad (TEST MODE - Replace with Adsgram)
            showAdvertisement()
                .then(() => {
                    // Increment ad counter
                    gameState.adsWatchedToday++;
                    
                    // Apply reward
                    switch(type) {
                        case 'double':
                            applyDoubleBoost();
                            break;
                        case 'auto':
                            applyAutoClicker();
                            break;
                        case 'lucky':
                            applyLuckyBox();
                            break;
                    }
                    
                    saveState();
                })
                .catch(() => {
                    showNotification('❌ باید تبلیغ رو کامل ببینی', 2000);
                });
        }

        // ==================== ADVERTISEMENT (REPLACE WITH ADSGRAM) ====================
        function showAdvertisement() {
            return new Promise((resolve, reject) => {
                // 
                // اینجا کد Adsgram رو قرار بده:
                //
                // if (window.AdController) {
                //     AdController.show()
                //         .then(() => resolve())
                //         .catch(() => reject());
                // } else {
                //     reject();
                // }
                //
                
                // نسخه تست (حذف کن وقتی Adsgram رو وصل کردی)
                const ok = confirm(
                    '📺 تبلیغ شماره ' + (gameState.adsWatchedToday + 1) + ' از ' + DAILY_AD_LIMIT + '\n\n' +
                    'برای دریافت جایزه، این تبلیغ رو ببین.\n' +
                    '(نسخه تست - Adsgram واقعی جایگزین میشه)'
                );
                if (ok) resolve();
                else reject();
            });
        }

        // ==================== REWARDS ====================
        function applyDoubleBoost() {
            gameState.doubleActive = true;
            gameState.multiplier = 2;
            showNotification('🔥 کلیک‌ها ۲ برابر شد! (۳۰ ثانیه)', 2000);
            
            setTimeout(() => {
                gameState.doubleActive = false;
                gameState.multiplier = 1;
                saveState();
                showNotification('⏰ تقویت دوبرابر تموم شد', 2000);
            }, 30000);
        }

        function applyAutoClicker() {
            gameState.autoActive = true;
            let clicksRemaining = 100;
            
            showNotification('🤖 کلیک خودکار شروع شد! (۱۰۰ کلیک)', 2000);
            
            gameState.autoInterval = setInterval(() => {
                if (clicksRemaining <= 0 || !gameState.autoActive) {
                    clearInterval(gameState.autoInterval);
                    gameState.autoActive = false;
                    saveState();
                    showNotification('⏰ کلیک خودکار تموم شد', 2000);
                    return;
                }
                
                gameState.balance += 1 * gameState.multiplier;
                gameState.totalClicks++;
                clicksRemaining--;
                updateAllUI();
            }, 300);
            
            // Safety timeout
            setTimeout(() => {
                if (gameState.autoActive) {
                    clearInterval(gameState.autoInterval);
                    gameState.autoActive = false;
                    saveState();
                }
            }, 35000);
        }

        function applyLuckyBox() {
            const prizes = [50, 100, 150, 200, 300, 500, 750, 1000, 2000, 5000];
            const prize = prizes[Math.floor(Math.random() * prizes.length)];
            gameState.balance += prize;
            showNotification('🎉 ' + numberFormat(prize) + ' سکه از جعبه شانس گرفتی!', 2500);
        }

        // ==================== WITHDRAW ====================
        function openWithdrawModal() {
            document.getElementById('modalBalance').textContent = numberFormat(gameState.balance);
            document.getElementById('withdrawModal').classList.add('show');
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').classList.remove('show');
            document.getElementById('walletInput').value = '';
            document.getElementById('amountInput').value = '';
        }

        function submitWithdraw() {
            const amount = parseInt(document.getElementById('amountInput').value);
            
            if (!amount || amount < 1000) {
                showNotification('⚠️ حداقل برداشت ۱۰۰۰ سکه است', 2500);
                return;
            }
            
            if (amount > gameState.balance) {
                showNotification('⚠️ موجودی کافی نیست', 2500);
                return;
            }
            
            gameState.balance -= amount;
            closeWithdrawModal();
            saveState();
            showNotification('✅ درخواست برداشت ' + numberFormat(amount) + ' سکه ثبت شد', 3000);
            
            // اینجا می‌تونی به سرور بفرستی
            console.log('WITHDRAW:', { amount, balance: gameState.balance });
        }

        // ==================== KEYBOARD SHORTCUTS (TEST) ====================
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') watchAd('double');
            if (e.key === '2') watchAd('auto');
            if (e.key === '3') watchAd('lucky');
        });

        // ==================== INIT ====================
        updateAllUI();
        
        console.log('🎮 سکه‌باز آماده!');
        console.log('📊 سقف تبلیغات: ' + DAILY_AD_LIMIT + ' عدد در روز');
        console.log('📺 تبلیغات دیده شده امروز: ' + gameState.adsWatchedToday);
        console.log('💰 موجودی: ' + numberFormat(gameState.balance));
        console.log('🔄 ریست روزانه: ساعت ۱۲ شب');
        console.log('');
        console.log('🔑 کلیدهای تست: 1=دوبرابر 2=کلیک خودکار 3=جعبه شانس');
    </script>

</body>
</html>
